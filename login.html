<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to MotorSure — Access your motor insurance policies, RC transfer status, fitness and PUC documents.">
  <title>Login — MotorSure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/dark-mode.css"><link rel="stylesheet" href="css/rtl.css"><link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Override login-page padding since header is removed */
    .login-page {
      padding: var(--space-10) var(--space-4);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <main id="main-content">
    <section class="login-page" aria-label="Login">
      <div class="login-page__card">
        <div style="text-align:center;margin-bottom:var(--space-6);">
          <div style="display:flex;align-items:center;justify-content:center;gap:var(--space-2);margin-bottom:var(--space-2);">
            <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--gradient-gold);display:flex;align-items:center;justify-content:center;color:var(--obsidian);"><svg viewBox="0 0 24 24" fill="none" stroke="#15191C" stroke-width="1.7" width="20" height="20" aria-hidden="true"><path d="M12 2.8L18.8 6V12.2C18.8 16 12 20.8 12 20.8S5.2 16 5.2 12.2V6L12 2.8Z" stroke-linejoin="round"/><circle cx="12" cy="11.2" r="4.6" stroke-width="1.4"/><circle cx="12" cy="11.2" r="1.3" stroke-width="1.2"/><path d="M12 6.6V9.9M16 13.45L13.15 11.9M8 13.45L10.85 11.9" stroke-linecap="round" stroke-width="1.4"/></svg></div>
            <span style="font-family:var(--font-heading);font-size:1.15rem;font-weight:700;">MotorSure</span>
          </div>
        </div>

        <div class="card" style="border-radius:var(--radius-xl);padding:var(--space-8);box-shadow:var(--shadow-lg);border:1px solid var(--color-border);">
          <div style="text-align:center;margin-bottom:var(--space-8);">
            <div style="width:56px;height:56px;margin:0 auto var(--space-4);border-radius:var(--radius-lg);background:var(--gradient-gold);display:flex;align-items:center;justify-content:center;color:var(--obsidian);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="28" height="28" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <h1 style="font-size:var(--fs-h2);margin-bottom:var(--space-2);">Welcome Back</h1>
            <p style="font-size:var(--fs-small);color:var(--color-text-secondary);margin-bottom:0;">Sign in to manage your policies, track RC transfers & download documents.</p>
          </div>

          <form data-validate novalidate>
            <div class="form-group">
              <label class="form-label" for="lp-email">Email Address</label>
              <input type="email" id="lp-email" class="form-input" placeholder="you@example.com" required data-validate-type="email" autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label" for="lp-password">Password</label>
              <input type="password" id="lp-password" class="form-input" placeholder="Enter your password" required data-min-length="6" autocomplete="current-password">
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;">
              <label style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-small);color:var(--color-text-secondary);cursor:pointer;user-select:none;">
                <input type="checkbox" style="width:16px;height:16px;accent-color:var(--color-accent);"> Remember me
              </label>
              <a href="#" onclick="event.preventDefault();alert('Password reset link will be sent to your email.');" style="font-size:var(--fs-small);font-weight:var(--fw-semibold);">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">Sign In</button>

            <div style="display:flex;align-items:center;gap:var(--space-4);margin:var(--space-6) 0;font-size:var(--fs-caption);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:var(--ls-wider);">
              <span style="flex:1;height:1px;background:var(--color-border);"></span> or <span style="flex:1;height:1px;background:var(--color-border);"></span>
            </div>

            <div style="display:grid;gap:var(--space-3);">
              <button type="button" class="btn btn--ghost" style="width:100%;justify-content:center;" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
              </button>
            </div>

            <div style="text-align:center;font-size:var(--fs-small);color:var(--color-text-secondary);margin-top:var(--space-6);padding-top:var(--space-6);border-top:1px solid var(--color-border);">
              Don't have an account? <a href="contact.html" style="font-weight:var(--fw-semibold);">Contact us to get started</a>
            </div>
          </form>
        </div>

        <p style="text-align:center;font-size:var(--fs-caption);color:var(--color-text-muted);margin-top:var(--space-6);">
          Protected by 256-bit SSL · <a href="privacy-policy.html">Privacy Policy</a> · <a href="terms.html">Terms</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/theme.js"></script><script src="js/forms.js"></script><script src="js/login.js"></script><script src="js/app.js"></script>
</body>
</html>
