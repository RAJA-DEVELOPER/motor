<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MotorSure is currently undergoing scheduled maintenance. We'll be back shortly.">
  <title>Maintenance — MotorSure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--obsidian:#15191C;--champagne:#C9A45C;--steel:#65727A;--ivory:#F7F5F0;--teal:#174A4A;--mist:#DDE4E3;}
    body{font-family:'Manrope',sans-serif;background:var(--obsidian);color:var(--ivory);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    body::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,0.08),transparent 70%);top:-150px;right:-150px;}
    body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(23,74,74,0.1),transparent 70%);bottom:-100px;left:-100px;}

    .maintenance{text-align:center;max-width:640px;padding:2rem;position:relative;z-index:1;}
    .maintenance__logo{display:flex;align-items:center;justify-content:center;gap:0.75rem;margin-bottom:3rem;opacity:0;animation:fadeIn .8s .2s forwards;}
    .maintenance__logo-icon{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--champagne),#B08D4A);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--obsidian);font-weight:700;}
    .maintenance__logo-text{font-family:'DM Serif Display',serif;font-size:1.5rem;}

    .maintenance__icon{width:80px;height:80px;margin:0 auto 2rem;opacity:0;animation:fadeIn .8s .4s forwards;}
    .maintenance__icon svg{width:100%;height:100%;animation:spin 8s linear infinite;}

    .maintenance__title{font-family:'DM Serif Display',serif;font-size:clamp(2rem,5vw,3rem);margin-bottom:1rem;opacity:0;animation:fadeIn .8s .6s forwards;}
    .maintenance__text{font-size:1.1rem;color:var(--mist);line-height:1.7;margin-bottom:2.5rem;max-width:500px;margin-left:auto;margin-right:auto;opacity:0;animation:fadeIn .8s .8s forwards;}

    .maintenance__countdown{display:flex;gap:1.5rem;justify-content:center;margin-bottom:3rem;flex-wrap:wrap;opacity:0;animation:fadeIn .8s 1s forwards;}
    .countdown-item{text-align:center;}
    .countdown-item__value{font-family:'DM Serif Display',serif;font-size:clamp(2.5rem,6vw,3.5rem);color:var(--champagne);line-height:1;display:block;min-width:70px;}
    .countdown-item__label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--steel);margin-top:0.5rem;}

    .maintenance__progress{max-width:400px;margin:0 auto 2.5rem;opacity:0;animation:fadeIn .8s 1.2s forwards;}
    .progress-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
    .progress-bar__fill{height:100%;width:75%;background:linear-gradient(90deg,var(--teal),var(--champagne));border-radius:2px;animation:progressPulse 2s ease-in-out infinite;}
    .progress-label{font-size:0.8rem;color:var(--steel);margin-top:0.75rem;}

    .maintenance__notify{max-width:420px;margin:0 auto 2rem;display:flex;gap:0.75rem;opacity:0;animation:fadeIn .8s 1.4s forwards;}
    .maintenance__notify input{flex:1;padding:0.875rem 1.25rem;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(255,255,255,0.05);color:var(--ivory);font-family:inherit;font-size:0.95rem;outline:none;transition:border-color .2s;}
    .maintenance__notify input:focus{border-color:var(--champagne);}
    .maintenance__notify input::placeholder{color:var(--steel);}
    .maintenance__notify button{padding:0.875rem 1.5rem;border:none;border-radius:8px;background:linear-gradient(135deg,var(--champagne),#B08D4A);color:var(--obsidian);font-family:inherit;font-weight:700;font-size:0.9rem;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap;}
    .maintenance__notify button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,164,92,0.3);}

    .maintenance__contact{opacity:0;animation:fadeIn .8s 1.6s forwards;}
    .maintenance__contact p{font-size:0.85rem;color:var(--steel);margin-bottom:0.25rem;}
    .maintenance__contact a{color:var(--champagne);text-decoration:none;transition:opacity .2s;}
    .maintenance__contact a:hover{opacity:0.8;}

    @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes progressPulse{0%,100%{opacity:1;}50%{opacity:0.6;}}

    @media(max-width:480px){.maintenance__countdown{gap:1rem;}.maintenance__notify{flex-direction:column;}}
  </style>
</head>
<body>
  <main class="maintenance" id="main-content">
    <!-- ══ SECTION 1: Logo ══ -->
    <div class="maintenance__logo">
      <div class="maintenance__logo-icon" style="display:flex;align-items:center;justify-content:center;color:var(--obsidian);"><svg viewBox="0 0 24 24" fill="none" stroke="#15191C" stroke-width="1.7" width="26" height="26" aria-hidden="true"><path d="M12 2.8L18.8 6V12.2C18.8 16 12 20.8 12 20.8S5.2 16 5.2 12.2V6L12 2.8Z" stroke-linejoin="round"/><circle cx="12" cy="11.2" r="4.6" stroke-width="1.4"/><circle cx="12" cy="11.2" r="1.3" stroke-width="1.2"/><path d="M12 6.6V9.9M16 13.45L13.15 11.9M8 13.45L10.85 11.9" stroke-linecap="round" stroke-width="1.4"/></svg></div>
      <span class="maintenance__logo-text">MotorSure</span>
    </div>

    <!-- ══ SECTION 2: Icon & Message ══ -->
    <div class="maintenance__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--champagne)" stroke-width="1.5">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <h1 class="maintenance__title">Under Maintenance</h1>
    <p class="maintenance__text">We're performing scheduled maintenance to improve our services. We'll be back online shortly with a better experience for you.</p>

    <!-- ══ SECTION 3: Countdown Timer ══ -->
    <div class="maintenance__countdown" id="countdown">
      <div class="countdown-item"><span class="countdown-item__value" id="cd-hours">02</span><span class="countdown-item__label">Hours</span></div>
      <div class="countdown-item"><span class="countdown-item__value" id="cd-minutes">30</span><span class="countdown-item__label">Minutes</span></div>
      <div class="countdown-item"><span class="countdown-item__value" id="cd-seconds">00</span><span class="countdown-item__label">Seconds</span></div>
    </div>

    <!-- ══ SECTION 4: Progress Bar ══ -->
    <div class="maintenance__progress">
      <div class="progress-bar"><div class="progress-bar__fill"></div></div>
      <p class="progress-label">Estimated 75% complete</p>
    </div>

    <!-- ══ SECTION 5: Notify Form ══ -->
    <form class="maintenance__notify" onsubmit="event.preventDefault();this.querySelector('button').textContent='Subscribed ✓';this.querySelector('input').disabled=true;">
      <input type="email" placeholder="Get notified when we're back" required aria-label="Email for notification">
      <button type="submit">Notify Me</button>
    </form>

    <!-- ══ SECTION 6: Emergency Contact ══ -->
    <div class="maintenance__contact">
      <p>For urgent insurance queries, please contact us:</p>
      <p><a href="tel:+919876543210">+91 98765 43210</a> · <a href="mailto:support@motorsure.in">support@motorsure.in</a></p>
    </div>
  </main>

  <script>
    // Countdown timer
    (function() {
      const endTime = new Date().getTime() + (2.5 * 60 * 60 * 1000);
      function updateCountdown() {
        const now = new Date().getTime();
        const diff = Math.max(0, endTime - now);
        const h = Math.floor(diff / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
        document.getElementById('cd-minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('cd-seconds').textContent = String(s).padStart(2, '0');
        if (diff > 0) requestAnimationFrame(updateCountdown);
      }
      updateCountdown();
    })();
  </script>
</body>
</html>
