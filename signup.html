<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a MotorSure account — Manage motor insurance policies, RC transfer status, fitness and PUC documents.">
  <title>Sign Up — MotorSure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/dark-mode.css"><link rel="stylesheet" href="css/rtl.css"><link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Override login-page padding since header is removed */
    .login-page {
      padding: var(--space-10) var(--space-4);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <main id="main-content">
    <section class="login-page" aria-label="Sign up">
      <div class="login-page__card" style="max-width:480px;">
        <div style="text-align:center;margin-bottom:var(--space-6);">
          <a href="index.html" aria-label="MotorSure Home" style="display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);margin-bottom:var(--space-2);text-decoration:none;color:inherit;">
            <span style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--gradient-gold);display:flex;align-items:center;justify-content:center;color:var(--obsidian);"><svg viewBox="0 0 24 24" fill="none" stroke="#15191C" stroke-width="1.7" width="20" height="20" aria-hidden="true"><path d="M12 2.8L18.8 6V12.2C18.8 16 12 20.8 12 20.8S5.2 16 5.2 12.2V6L12 2.8Z" stroke-linejoin="round"/><circle cx="12" cy="11.2" r="4.6" stroke-width="1.4"/><circle cx="12" cy="11.2" r="1.3" stroke-width="1.2"/><path d="M12 6.6V9.9M16 13.45L13.15 11.9M8 13.45L10.85 11.9" stroke-linecap="round" stroke-width="1.4"/></svg></span>
            <span style="font-family:var(--font-heading);font-size:1.15rem;font-weight:700;">MotorSure</span>
          </a>
        </div>

        <div class="card" style="border-radius:var(--radius-xl);padding:var(--space-8);box-shadow:var(--shadow-lg);border:1px solid var(--color-border);">
          <div style="text-align:center;margin-bottom:var(--space-8);">
            <div style="width:56px;height:56px;margin:0 auto var(--space-4);border-radius:var(--radius-lg);background:var(--gradient-gold);display:flex;align-items:center;justify-content:center;color:var(--obsidian);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="28" height="28" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </div>
            <h1 style="font-size:var(--fs-h2);margin-bottom:var(--space-2);">Create Account</h1>
            <p style="font-size:var(--fs-small);color:var(--color-text-secondary);margin-bottom:0;">Join MotorSure to manage policies, track RC transfers & download documents.</p>
          </div>

          <form data-validate data-form-type="signup" novalidate>
            <div class="form-group">
              <label class="form-label" for="su-name">Full Name</label>
              <input type="text" id="su-name" class="form-input" placeholder="John Doe" required autocomplete="name">
            </div>
            <div class="form-group">
              <label class="form-label" for="su-email">Email Address</label>
              <input type="email" id="su-email" class="form-input" placeholder="you@example.com" required data-validate-type="email" autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label" for="su-phone">Phone Number</label>
              <input type="tel" id="su-phone" class="form-input" placeholder="+91 98765 43210" required data-validate-type="tel" autocomplete="tel">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">
              <div class="form-group">
                <label class="form-label" for="su-password">Password</label>
                <input type="password" id="su-password" class="form-input" placeholder="Min. 6 characters" required data-min-length="6" autocomplete="new-password">
              </div>
              <div class="form-group">
                <label class="form-label" for="su-confirm">Confirm Password</label>
                <input type="password" id="su-confirm" class="form-input" placeholder="Repeat password" required data-min-length="6" data-match="su-password" autocomplete="new-password">
              </div>
            </div>

            <label style="display:flex;align-items:flex-start;gap:var(--space-2);font-size:var(--fs-small);color:var(--color-text-secondary);cursor:pointer;user-select:none;margin-bottom:var(--space-6);line-height:1.5;">
              <input type="checkbox" id="su-terms" required style="width:16px;height:16px;accent-color:var(--color-accent);margin-top:2px;flex-shrink:0;">
              <span>I agree to the <a href="terms.html" style="font-weight:var(--fw-semibold);">Terms &amp; Conditions</a> and <a href="privacy-policy.html" style="font-weight:var(--fw-semibold);">Privacy Policy</a></span>
            </label>

            <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">Create Account</button>

            <div style="display:flex;align-items:center;gap:var(--space-4);margin:var(--space-6) 0;font-size:var(--fs-caption);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:var(--ls-wider);">
              <span style="flex:1;height:1px;background:var(--color-border);"></span> or <span style="flex:1;height:1px;background:var(--color-border);"></span>
            </div>

            <div style="display:grid;gap:var(--space-3);">
              <button type="button" class="btn btn--ghost" style="width:100%;justify-content:center;" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
              </button>
              <button type="button" class="btn btn--dark" style="width:100%;justify-content:center;" onclick="window.location.href='index.html'" aria-label="Continue with Apple">
                <svg viewBox="0 0 384 512" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                Continue with Apple
              </button>
            </div>

            <div style="text-align:center;font-size:var(--fs-small);color:var(--color-text-secondary);margin-top:var(--space-6);padding-top:var(--space-6);border-top:1px solid var(--color-border);">
              Already have an account? <a href="login.html" style="font-weight:var(--fw-semibold);">Sign in</a>
            </div>
          </form>
        </div>

        <p style="text-align:center;font-size:var(--fs-caption);color:var(--color-text-muted);margin-top:var(--space-6);">
          Protected by 256-bit SSL · <a href="privacy-policy.html">Privacy Policy</a> · <a href="terms.html">Terms</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/theme.js"></script><script src="js/rtl.js"></script><script src="js/navbar.js"></script><script src="js/scroll-reveal.js"></script><script src="js/forms.js"></script><script src="js/back-to-top.js"></script><script src="js/page-transitions.js"></script><script src="js/lazy-load.js"></script><script src="js/login.js"></script><script src="js/app.js"></script>
</body>
</html>
